# Optimized CPU pretrain config for Myanmar syllable-cluster JSONL
# UPDATED to be tok2vec-structure-compatible with your BILU training config.
# Load-bearing matches:
#   - MultiHashEmbed attrs/rows (ORTH,PREFIX,SUFFIX,SHAPE,LENGTH) + rows=[50000,5000,5000,5000,1000]
#   - MaxoutWindowEncoder depth=6, window_size=2, maxout_pieces=3, width=128

[paths]
raw_text = "C:\\Users\\conra\\Desktop\\burmese d\\randomdata\\bilurun2\\chronicles.pretrain.jsonl"
vectors = null
init_tok2vec = null

[system]
gpu_allocator = null
seed = 13

[nlp]
lang = "xx"
pipeline = ["tok2vec"]
batch_size = 256
disabled = []
before_creation = null
after_creation = null
after_pipeline_creation = null
tokenizer = {"@tokenizers":"spacy.Tokenizer.v1"}
vectors = {"@vectors":"spacy.Vectors.v1"}

[components]

[components.tok2vec]
factory = "tok2vec"

[components.tok2vec.model]
@architectures = "spacy.Tok2Vec.v2"

[components.tok2vec.model.embed]
@architectures = "spacy.MultiHashEmbed.v2"
width = 128
attrs = ["ORTH","PREFIX","SUFFIX","SHAPE","LENGTH"]
rows = [50000,5000,5000,5000,1000]
include_static_vectors = false

[components.tok2vec.model.encode]
@architectures = "spacy.MaxoutWindowEncoder.v2"
width = 128
depth = 6
window_size = 2
maxout_pieces = 3

[corpora]

[corpora.pretrain]
@readers = "spacy.JsonlCorpus.v1"
path = ${paths.raw_text}
max_length = 10000
limit = 0

[pretraining]
corpus = "corpora.pretrain"
component = "tok2vec"
layer = ""
max_epochs = 30
dropout = 0.2
n_save_every = null
n_save_epoch = 1

[pretraining.batcher]
@batchers = "spacy.batch_by_words.v1"
size = 2000
discard_oversize = false
tolerance = 0.2
get_length = null

[pretraining.objective]
@architectures = "spacy.PretrainCharacters.v1"
maxout_pieces = 3
hidden_size = 256
n_characters = 4

[pretraining.optimizer]
@optimizers = "Adam.v1"
beta1 = 0.9
beta2 = 0.999
L2_is_weight_decay = true
L2 = 0.001
grad_clip = 1.0
use_averages = true
eps = 0.00000001
learn_rate = 0.0005

[training]
seed = ${system.seed}
gpu_allocator = ${system.gpu_allocator}

# REQUIRED by nlp.initialize(); keep consistent with your BILU training optimizer.
[training.optimizer]
@optimizers = "Adam.v1"
beta1 = 0.9
beta2 = 0.999
L2_is_weight_decay = true
L2 = 0.001
grad_clip = 1.0
use_averages = true
eps = 0.00000001
learn_rate = 0.0005

[initialize]
vectors = null
init_tok2vec = ${paths.init_tok2vec}
vocab_data = null
lookups = null
before_init = null
after_init = null

[initialize.components]

[initialize.tokenizer]
